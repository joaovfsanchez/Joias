<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Charm - Joias & Cosméticos</title>
  <style>
    :root {
      --bg-dark: #0a192f;
      --card-bg: #0d213a;
      --gold: #d4af37;
      --white: #ffffff;
      --text-muted: #a8b2d1;
      --danger: #ff4d4d;
      --success: #2ecc71;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--white);
      user-select: none;
    }
    
    header {
      background-color: #050c1a;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    header h1:active { opacity: 0.7; }

    .cart-btn-header {
      background-color: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      transition: transform 0.2s;
    }

    .cart-btn-header:hover { transform: scale(1.05); }

    .cart-count {
      background-color: var(--bg-dark);
      color: var(--gold);
      border-radius: 50%;
      padding: 2px 7px;
      font-size: 12px;
    }

    .hero {
      text-align: center;
      padding: 25px 20px 15px 20px;
      background: linear-gradient(180deg, #050c1a 0%, var(--bg-dark) 100%);
    }

    .hero h2 {
      color: var(--gold);
      font-size: 28px;
      letter-spacing: 3px;
      font-weight: 300;
      margin-bottom: 8px;
    }

    .frete-notice {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      font-style: italic;
    }

    /* BARRA DE CATEGORIAS */
    .categories-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 15px 20px;
      background-color: #050c1a;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      justify-content: flex-start;
      scrollbar-width: thin;
    }

    .cat-btn {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background-color: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 280px));
      gap: 25px;
      justify-content: center;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 15px;
      position: relative;
      transition: transform 0.2s;
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
    }

    .card.inativo { opacity: 0.5; border-color: #555; }
    .card:hover { transform: translateY(-5px); }

    .card-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: var(--gold);
      color: var(--bg-dark);
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #050c1a;
    }

    .card h3 {
      font-size: 15px;
      margin: 12px 0 3px 0;
      color: var(--white);
      letter-spacing: 1px;
    }

    .card .category-tag {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card .price {
      color: var(--gold);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn-add-cart {
      background-color: transparent;
      color: var(--white);
      border: 1px solid var(--gold);
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
      transition: all 0.3s;
    }

    .btn-add-cart:hover {
      background-color: var(--gold);
      color: var(--bg-dark);
    }

    .admin-controls {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(212, 175, 55, 0.3);
    }

    .btn-action {
      flex: 1;
      padding: 6px;
      font-size: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-toggle { background-color: #3498db; color: white; }
    .btn-delete { background-color: var(--danger); color: white; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(5, 12, 26, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      color: var(--gold);
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    .cart-item-info h4 { font-size: 14px; color: var(--white); }
    .cart-item-info span { font-size: 13px; color: var(--gold); }

    .btn-remove-item {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
      padding: 0 5px;
    }

    .cart-total {
      margin-top: 20px;
      text-align: right;
      font-size: 18px;
      color: var(--gold);
      font-weight: bold;
    }

    .btn-whatsapp-send {
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .admin-form label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .admin-form input, .admin-form select {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      background-color: #050c1a;
      color: var(--white);
      outline: none;
      margin-bottom: 15px;
    }

    .preview-box {
      width: 120px;
      height: 120px;
      border: 1px dashed var(--gold);
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background-color: #050c1a;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .preview-box span {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 5px;
    }

    .btn-admin {
      width: 100%;
      background-color: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 15px;
      color: var(--white);
      font-size: 24px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      background-color: #050c1a;
      margin-top: 60px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="brand-title" title="Segure por 3 segundos para gerenciar">MI CHARM</h1>
    <button class="cart-btn-header" onclick="abrirCarrinho()">
      🛒 CARRINHO <span class="cart-count" id="cart-count">0</span>
    </button>
  </header>

  <section class="hero">
    <h2>REVELE SEU CHARME</h2>
    <p class="frete-notice">Para opções de frete, consulte atendente da loja!</p>
  </section>

  <!-- FILTRO DE CATEGORIAS -->
  <nav class="categories-bar">
    <button class="cat-btn active" onclick="filtrarCategoria('TODOS', this)">Todos</button>
    <button class="cat-btn" onclick="filtrarCategoria('Maquiagem', this)">Maquiagem</button>
    <button class="cat-btn" onclick="filtrarCategoria('Skin care', this)">Skin care</button>
    <button class="cat-btn" onclick="filtrarCategoria('Cosméticos', this)">Cosméticos</button>
    <button class="cat-btn" onclick="filtrarCategoria('Joias', this)">Jóias</button>
    <button class="cat-btn" onclick="filtrarCategoria('Colar', this)">Colares</button>
    <button class="cat-btn" onclick="filtrarCategoria('Anéis', this)">Anéis</button>
    <button class="cat-btn" onclick="filtrarCategoria('Pulseiras', this)">Pulseiras</button>
    <button class="cat-btn" onclick="filtrarCategoria('Brincos', this)">Brincos</button>
  </nav>

  <main class="container">
    <div class="grid" id="produtos-container">
      <!-- Produtos inseridos dinamicamente -->
    </div>
  </main>

  <!-- MODAL DO CARRINHO DE COMPRAS -->
  <div id="modal-carrinho" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModais()">&times;</span>
      <h3>SEU CARRINHO</h3>
      <div id="carrinho-itens"></div>
      <div class="cart-total" id="carrinho-total">Total: R$ 0,00</div>
      <button class="btn-whatsapp-send" onclick="enviarPedidoWhatsApp()">FINALIZAR PEDIDO VIA WHATSAPP</button>
    </div>
  </div>

  <!-- MODAL 1: Login Admin -->
  <div id="modal-login" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModais()">&times;</span>
      <h3>ACESSO ADMINISTRATIVO</h3>
      <div class="admin-form">
        <label>Senha de Acesso</label>
        <input type="password" id="admin-pass" placeholder="****">
        <button class="btn-admin" onclick="validarSenha()">ENTRAR</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Cadastro de Produto -->
  <div id="modal-cadastro" class="modal">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModais()">&times;</span>
      <h3>CADASTRAR NOVO PRODUTO</h3>
      <form class="admin-form" onsubmit="salvarProduto(event)">
        <label>Nome do Produto</label>
        <input type="text" id="prod-nome" required placeholder="Ex: Batom Matte / Anel Solitário">

        <label>Categoria</label>
        <select id="prod-categoria" required>
          <option value="Joias">Jóias</option>
          <option value="Colar">Colares</option>
          <option value="Anéis">Anéis</option>
          <option value="Pulseiras">Pulseiras</option>
          <option value="Brincos">Brincos</option>
          <option value="Maquiagem">Maquiagem</option>
          <option value="Skin care">Skin care</option>
          <option value="Cosméticos">Cosméticos</option>
        </select>

        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="prod-valor" required placeholder="Ex: 49.90">

        <label>Selecione a Foto do Celular</label>
        <input type="file" id="prod-foto-file" accept="image/*" onchange="processarImagem(event)" required>

        <div class="preview-box">
          <span id="preview-placeholder">Prévia da Foto (Quadrada)</span>
          <img id="img-preview" alt="Prévia">
        </div>

        <button type="submit" class="btn-admin">SALVAR E PUBLICAR NA NUVEM</button>
      </form>
    </div>
  </div>

  <footer>
    <p>MI CHARM JOIAS & COSMÉTICOS | TODOS OS DIREITOS RESERVADOS</p>
  </footer>

  <script>
    // === CONFIGURAÇÕES DA API JSONBIN ===
    const JSONBIN_BIN_ID = "6a7142b2f5f4af5e29e78d30";
    const JSONBIN_SECRET_KEY = "$2a$10$OqN7YUEHurzEKxBD/ta2I./9ZjvaUutvOXYf9qNTIiWnLZdiW97hq";
    const SENHA_MESTRE = "1234";
    const NUMERO_WHATSAPP = "5574991309816";

    const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    let imagemProcessadaBase64 = "";
    let modoAdmin = false;
    let listaProdutosGlobal = [];
    let carrinho = [];
    let categoriaAtual = 'TODOS';

    // 1. Carregar Produtos direto da Nuvem
    async function carregarProdutos() {
      const container = document.getElementById('produtos-container');
      container.innerHTML = '<p style="color: var(--gold); text-align: center; grid-column: 1/-1;">Carregando produtos do catálogo...</p>';

      try {
        const response = await fetch(`${API_URL}/latest`, {
          method: 'GET',
          headers: {
            'X-Master-Key': JSONBIN_SECRET_KEY,
            'X-Bin-Meta': 'false'
          }
        });

        if (!response.ok) throw new Error('Erro ao buscar dados');

        const dados = await response.json();
        listaProdutosGlobal = Array.isArray(dados) ? dados : [];
        renderizarGrid();
      } catch (err) {
        console.error("Erro na nuvem, buscando backup local:", err);
        listaProdutosGlobal = JSON.parse(localStorage.getItem('produtos_local') || '[]');
        renderizarGrid();
      }
    }

    // 2. Salvar Mudancas Globais na Nuvem
    async function salvarMudancasGlobais() {
      localStorage.setItem('produtos_local', JSON.stringify(listaProdutosGlobal));
      renderizarGrid();

      try {
        const response = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_SECRET_KEY
          },
          body: JSON.stringify(listaProdutosGlobal)
        });

        if (!response.ok) {
          alert('Atenção: Não foi possível salvar na nuvem.');
        }
      } catch (err) {
        alert('Erro de conexão ao salvar na nuvem.');
      }
    }

    // Filtrar Categoria ao clicar nos botões do topo
    function filtrarCategoria(categoria, elemento) {
      categoriaAtual = categoria;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      if(elemento) elemento.classList.add('active');
      renderizarGrid();
    }

    // Renderizar a Grid de Produtos
    function renderizarGrid() {
      const container = document.getElementById('produtos-container');

      if (!listaProdutosGlobal || listaProdutosGlobal.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Nenhum produto cadastrado no catálogo.</p>';
        return;
      }

      // Filtra por status de visibilidade e categoria selecionada
      let produtosFiltrados = modoAdmin 
        ? listaProdutosGlobal 
        : listaProdutosGlobal.filter(p => p.ativo !== false);

      if (categoriaAtual !== 'TODOS') {
        produtosFiltrados = produtosFiltrados.filter(p => p.categoria === categoriaAtual);
      }

      if (produtosFiltrados.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1;">Nenhum produto encontrado na categoria "${categoriaAtual}".</p>`;
        return;
      }

      container.innerHTML = produtosFiltrados.map((item) => {
        const idReal = listaProdutosGlobal.indexOf(item);
        const isAtivo = item.ativo !== false;
        const codigoId = item.id ? `#${item.id}` : `#${idReal + 1}`;

        return `
          <div class="card ${!isAtivo ? 'inativo' : ''}">
            <span class="card-badge">${codigoId}</span>
            <img src="${item.imagem}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x300/0d213a/d4af37?text=Produto'">
            <h3>${item.title.toUpperCase()} ${!isAtivo ? '<br><small style="color:var(--danger)">(INDISPONÍVEL)</small>' : ''}</h3>
            <div class="category-tag">${item.categoria || 'Geral'}</div>
            <div class="price">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</div>
            
            ${isAtivo ? `
              <button class="btn-add-cart" onclick="adicionarAoCarrinho(${idReal})">🛒 ADICIONAR AO CARRINHO</button>
            ` : '<span style="color:var(--text-muted); font-size:12px;">PRODUTO PAUSADO</span>'}

            ${modoAdmin ? `
              <div class="admin-controls">
                <button class="btn-action btn-toggle" onclick="alternarStatus(${idReal})">
                  ${isAtivo ? 'Desativar' : 'Ativar'}
                </button>
                <button class="btn-action btn-delete" onclick="excluirProduto(${idReal})">Excluir</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // --- FUNÇÕES DO CARRINHO ---
    function adicionarAoCarrinho(index) {
      const produto = listaProdutosGlobal[index];
      carrinho.push(produto);
      atualizarContadorCarrinho();
      alert(`"${produto.title}" (Cód: #${produto.id || index + 1}) foi adicionado ao carrinho!`);
    }

    function atualizarContadorCarrinho() {
      document.getElementById('cart-count').innerText = carrinho.length;
    }

    function abrirCarrinho() {
      const containerItens = document.getElementById('carrinho-itens');
      const totalContainer = document.getElementById('carrinho-total');

      if (carrinho.length === 0) {
        containerItens.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Seu carrinho está vazio.</p>';
        totalContainer.innerText = 'Total: R$ 0,00';
      } else {
        let total = 0;
        containerItens.innerHTML = carrinho.map((item, index) => {
          total += parseFloat(item.preco);
          const codigoId = item.id ? `#${item.id}` : `#${listaProdutosGlobal.indexOf(item) + 1}`;
          return `
            <div class="cart-item">
              <div class="cart-item-info">
                <h4><strong style="color:var(--gold);">${codigoId}</strong> - ${item.title}</h4>
                <span>R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</span>
              </div>
              <button class="btn-remove-item" onclick="removerDoCarrinho(${index})">&times;</button>
            </div>
          `;
        }).join('');

        totalContainer.innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
      }

      document.getElementById('modal-carrinho').style.display = 'flex';
    }

    function removerDoCarrinho(index) {
      carrinho.splice(index, 1);
      atualizarContadorCarrinho();
      abrirCarrinho();
    }

    function enviarPedidoWhatsApp() {
      if (carrinho.length === 0) {
        alert('Adicione produtos ao carrinho antes de finalizar!');
        return;
      }

      let mensagem = "Olá, tudo bem?\n\nGostaria dos seguintes produtos:\n\n";
      let total = 0;

      carrinho.forEach(item => {
        const precoFormatado = parseFloat(item.preco).toFixed(2).replace('.', ',');
        const codigoId = item.id ? `#${item.id}` : `#${listaProdutosGlobal.indexOf(item) + 1}`;
        mensagem += `• [Cód: ${codigoId}] ${item.title} - R$ ${precoFormatado}\n`;
        total += parseFloat(item.preco);
      });

      mensagem += `\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*`;

      const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
      window.open(urlWhatsApp, '_blank');
    }

    // --- FUNÇÕES ADMIN ---
    function alternarStatus(index) {
      listaProdutosGlobal[index].ativo = !(listaProdutosGlobal[index].ativo !== false);
      salvarMudancasGlobais();
    }

    function excluirProduto(index) {
      if (confirm('Tem certeza que deseja remover este produto do catálogo?')) {
        listaProdutosGlobal.splice(index, 1);
        salvarMudancasGlobais();
      }
    }

    function processarImagem(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const tamanho = 500;
          canvas.width = tamanho;
          canvas.height = tamanho;

          const ctx = canvas.getContext('2d');
          let minDim = Math.min(img.width, img.height);
          let sx = (img.width - minDim) / 2;
          let sy = (img.height - minDim) / 2;

          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, tamanho, tamanho);
          imagemProcessadaBase64 = canvas.toDataURL('image/jpeg', 0.80);

          const previewImg = document.getElementById('img-preview');
          previewImg.src = imagemProcessadaBase64;
          previewImg.style.display = 'block';
          document.getElementById('preview-placeholder').style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Clique 3 Segundos no Título
    const tituloHeader = document.getElementById('brand-title');
    let timerPressionar;

    function iniciarContagem() {
      timerPressionar = setTimeout(() => {
        document.getElementById('modal-login').style.display = 'flex';
      }, 3000);
    }

    function cancelarContagem() { clearTimeout(timerPressionar); }

    tituloHeader.addEventListener('mousedown', iniciarContagem);
    tituloHeader.addEventListener('mouseup', cancelarContagem);
    tituloHeader.addEventListener('mouseleave', cancelarContagem);
    tituloHeader.addEventListener('touchstart', iniciarContagem);
    tituloHeader.addEventListener('touchend', cancelarContagem);

    function validarSenha() {
      const senhaDigitada = document.getElementById('admin-pass').value;
      if (senhaDigitada === SENHA_MESTRE) {
        modoAdmin = true;
        document.getElementById('modal-login').style.display = 'none';
        document.getElementById('modal-cadastro').style.display = 'flex';
        document.getElementById('admin-pass').value = '';
        renderizarGrid();
      } else {
        alert('Senha incorreta!');
      }
    }

    function fecharModais() {
      document.getElementById('modal-carrinho').style.display = 'none';
      document.getElementById('modal-login').style.display = 'none';
      document.getElementById('modal-cadastro').style.display = 'none';
    }

    async function salvarProduto(event) {
      event.preventDefault();
      
      const nome = document.getElementById('prod-nome').value;
      const categoria = document.getElementById('prod-categoria').value;
      const preco = parseFloat(document.getElementById('prod-valor').value);

      if (!imagemProcessadaBase64) {
        alert('Selecione uma foto válida.');
        return;
      }

      // Descobre o maior ID atual para definir o próximo sequencial
      const maiorId = listaProdutosGlobal.reduce((max, item) => (item.id && item.id > max ? item.id : max), 0);
      const novoId = maiorId + 1;

      const novoItem = {
        id: novoId,
        title: nome,
        categoria: categoria,
        preco: preco,
        imagem: imagemProcessadaBase64,
        ativo: true
      };

      listaProdutosGlobal.unshift(novoItem);
      
      await salvarMudancasGlobais();

      alert(`Produto #${novoId} ("${nome}") cadastrado com sucesso!`);
      fecharModais();

      document.getElementById('prod-nome').value = '';
      document.getElementById('prod-valor').value = '';
      document.getElementById('prod-foto-file').value = '';
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('preview-placeholder').style.display = 'block';
      imagemProcessadaBase64 = "";
    }

    carregarProdutos();
  </script>
</body>
</html>
