<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Charm - Joias</title>
  <style>
    :root {
      --bg-dark: #0a192f;
      --card-bg: #0d213a;
      --gold: #d4af37;
      --white: #ffffff;
      --text-muted: #a8b2d1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--white);
      user-select: none;
    }
    
    header {
      background-color: #050c1a;
      padding: 20px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    header h1 {
      color: var(--gold);
      font-size: 24px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: opacity 0.3s;
    }

    header h1:active { opacity: 0.7; }

    nav a {
      color: var(--white);
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a:hover { color: var(--gold); }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #050c1a 0%, var(--bg-dark) 100%);
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }

    .hero h2 {
      color: var(--gold);
      font-size: 28px;
      letter-spacing: 3px;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    /* Grid de Produtos */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 15px;
      transition: transform 0.2s;
    }

    .card:hover { transform: translateY(-5px); }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #050c1a;
    }

    .card h3 {
      font-size: 16px;
      margin: 15px 0 5px 0;
      color: var(--white);
      letter-spacing: 1px;
    }

    .card .price {
      color: var(--gold);
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card .btn-whatsapp {
      background-color: transparent;
      color: var(--white);
      border: 1px solid var(--white);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s;
    }

    .card .btn-whatsapp:hover {
      background-color: var(--gold);
      color: var(--bg-dark);
      border-color: var(--gold);
    }

    /* Caixa do Simulador de Frete */
    .frete-section {
      background-color: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 25px;
      margin-top: 50px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .frete-section h3 {
      color: var(--gold);
      margin-bottom: 15px;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .frete-form {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .frete-form input {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      background-color: #050c1a;
      color: var(--white);
      outline: none;
      width: 60%;
    }

    .frete-form button {
      background-color: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado-frete { margin-top: 20px; text-align: left; }

    .frete-item {
      background: #050c1a;
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .frete-item small { color: var(--text-muted); }

    /* Modais Ocultos do Admin */
    .modal-admin {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(5, 12, 26, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
      position: relative;
    }

    .modal-content h3 {
      color: var(--gold);
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1px;
    }

    .admin-form label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .admin-form input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      background-color: #050c1a;
      color: var(--white);
      outline: none;
      margin-bottom: 15px;
    }

    /* Preview Quadrado da Foto */
    .preview-box {
      width: 120px;
      height: 120px;
      border: 1px dashed var(--gold);
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 6px;
      background-color: #050c1a;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .preview-box span {
      font-size: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 5px;
    }

    .btn-admin {
      width: 100%;
      background-color: var(--gold);
      color: var(--bg-dark);
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 15px;
      color: var(--white);
      font-size: 24px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      background-color: #050c1a;
      margin-top: 60px;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="brand-title" title="Segure por 3 segundos para gerenciar">MI CHARM</h1>
    <nav>
      <a href="#">Novidades</a>
      <a href="#">Joias</a>
      <a href="#">Contato</a>
    </nav>
  </header>

  <section class="hero">
    <h2>REVELE SEU CHARME</h2>
  </section>

  <main class="container">
    <!-- Grid de Produtos -->
    <div class="grid" id="produtos-container">
      <!-- Produtos inseridos dinamicamente -->
    </div>

    <!-- Simulador de Frete -->
    <section class="frete-section">
      <h3>SIMULADOR DE FRETE</h3>
      <div class="frete-form">
        <input type="text" id="cep-input" placeholder="Digite seu CEP" maxlength="9">
        <button onclick="calcularFrete()">CALCULAR</button>
      </div>
      <div id="resultado-frete"></div>
    </section>
  </main>

  <!-- MODAL 1: Login de Acesso Oculto -->
  <div id="modal-login" class="modal-admin">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModais()">&times;</span>
      <h3>ACESSO ADMINISTRATIVO</h3>
      <div class="admin-form">
        <label>Senha de Acesso</label>
        <input type="password" id="admin-pass" placeholder="****">
        <button class="btn-admin" onclick="validarSenha()">ENTRAR</button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: Cadastro de Novo Produto -->
  <div id="modal-cadastro" class="modal-admin">
    <div class="modal-content">
      <span class="close-modal" onclick="fecharModais()">&times;</span>
      <h3>CADASTRAR NOVO PRODUTO</h3>
      <form class="admin-form" onsubmit="salvarProduto(event)">
        <label>Nome da Joia</label>
        <input type="text" id="prod-nome" required placeholder="Ex: Anel Solitário Prata">

        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="prod-valor" required placeholder="Ex: 49.90">

        <label>Selecione a Foto do Celular</label>
        <input type="file" id="prod-foto-file" accept="image/*" onchange="processarImagem(event)" required>

        <!-- Preview da Imagem Quadrada Recortada -->
        <div class="preview-box">
          <span id="preview-placeholder">Prévia da Foto (Quadrada)</span>
          <img id="img-preview" alt="Prévia">
        </div>

        <button type="submit" class="btn-admin">SALVAR E ADICIONAR AO CATÁLOGO</button>
      </form>
    </div>
  </div>

  <footer>
    <p>MI CHARM JOIAS | TODOS OS DIREITOS RESERVADOS</p>
  </footer>

  <script>
    const SENHA_MESTRE = "1234"; // Defina a senha aqui
    let imagemProcessadaBase64 = ""; // Guarda a imagem recortada e convertida

    // 1. Carregar Produtos
    async function carregarProdutos() {
      const container = document.getElementById('produtos-container');
      let produtos = [];

      try {
        const response = await fetch('data/produtos.json');
        produtos = await response.json();
      } catch (err) {
        console.warn('Usando lista vazia ou salvamentos locais.');
      }

      const salvosLocais = JSON.parse(localStorage.getItem('produtos_extra') || '[]');
      const listaCompleta = [...produtos, ...salvosLocais];

      container.innerHTML = listaCompleta.map(item => `
        <div class="card">
          <img src="${item.imagem}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x300/0d213a/d4af37?text=Joia'">
          <h3>${item.title.toUpperCase()}</h3>
          <div class="price">R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}</div>
          <a href="https://wa.me/5500000000000?text=Olá,%20gostaria%20de%20saber%20mais%20sobre:%20${encodeURIComponent(item.title)}" target="_blank" class="btn-whatsapp">VER MAIS / COMPRAR</a>
        </div>
      `).join('');
    }

    // 2. Processador e Cortador Automático de Imagem (Formato Quadrado 1:1 / JPEG Otimizado)
    function processarImagem(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          // Cria o Canvas
          const canvas = document.createElement('canvas');
          const tamanhoDesejado = 600; // Tamanho ideal em pixels (600x600)
          canvas.width = tamanhoDesejado;
          canvas.height = tamanhoDesejado;

          const ctx = canvas.getContext('2d');

          // Lógica de corte centralizado (Crop Quadrado)
          let minDim = Math.min(img.width, img.height);
          let sx = (img.width - minDim) / 2;
          let sy = (img.height - minDim) / 2;

          // Desenha a imagem cortada no canvas
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, tamanhoDesejado, tamanhoDesejado);

          // Converte para JPEG otimizado (qualidade 85%)
          imagemProcessadaBase64 = canvas.toDataURL('image/jpeg', 0.85);

          // Exibe no preview
          const previewImg = document.getElementById('img-preview');
          previewImg.src = imagemProcessadaBase64;
          previewImg.style.display = 'block';
          document.getElementById('preview-placeholder').style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 3. Clique de 3 Segundos no Título "MI CHARM"
    const tituloHeader = document.getElementById('brand-title');
    let timerPressionar;

    function iniciarContagem() {
      timerPressionar = setTimeout(() => {
        document.getElementById('modal-login').style.display = 'flex';
      }, 3000);
    }

    function cancelarContagem() { clearTimeout(timerPressionar); }

    tituloHeader.addEventListener('mousedown', iniciarContagem);
    tituloHeader.addEventListener('mouseup', cancelarContagem);
    tituloHeader.addEventListener('mouseleave', cancelarContagem);
    tituloHeader.addEventListener('touchstart', iniciarContagem);
    tituloHeader.addEventListener('touchend', cancelarContagem);

    // 4. Validação da Senha
    function validarSenha() {
      const senhaDigitada = document.getElementById('admin-pass').value;
      if (senhaDigitada === SENHA_MESTRE) {
        document.getElementById('modal-login').style.display = 'none';
        document.getElementById('modal-cadastro').style.display = 'flex';
        document.getElementById('admin-pass').value = '';
      } else {
        alert('Senha incorreta!');
      }
    }

    function fecharModais() {
      document.getElementById('modal-login').style.display = 'none';
      document.getElementById('modal-cadastro').style.display = 'none';
    }

    // 5. Salvar Produto no Catálogo
    function salvarProduto(event) {
      event.preventDefault();
      
      const nome = document.getElementById('prod-nome').value;
      const preco = parseFloat(document.getElementById('prod-valor').value);

      if (!imagemProcessadaBase64) {
        alert('Aguarde o carregamento da imagem ou selecione outra.');
        return;
      }

      const novoItem = { title: nome, preco: preco, imagem: imagemProcessadaBase64 };

      const salvosLocais = JSON.parse(localStorage.getItem('produtos_extra') || '[]');
      salvosLocais.push(novoItem);
      localStorage.setItem('produtos_extra', JSON.stringify(salvosLocais));

      carregarProdutos();
      alert('Produto cadastrado com sucesso!');
      fecharModais();

      // Limpa os campos
      document.getElementById('prod-nome').value = '';
      document.getElementById('prod-valor').value = '';
      document.getElementById('prod-foto-file').value = '';
      document.getElementById('img-preview').style.display = 'none';
      document.getElementById('preview-placeholder').style.display = 'block';
      imagemProcessadaBase64 = "";
    }

    // 6. Calculadora de Frete
    async function calcularFrete() {
      const cep = document.getElementById('cep-input').value.replace(/\D/g, '');
      const container = document.getElementById('resultado-frete');

      if (cep.length !== 8) {
        alert('Digite um CEP válido com 8 dígitos.');
        return;
      }

      container.innerHTML = '<p style="color: var(--gold); text-align: center;">Calculando frete...</p>';

      try {
        const res = await fetch(`https://calculador-frete-joias.joaovfsanchez.workers.dev/?cep=${cep}`);
        const dados = await res.json();

        const validos = dados.filter(item => !item.error);

        if (validos.length === 0) {
          container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Nenhum frete disponível para este CEP.</p>';
          return;
        }

        container.innerHTML = validos.map(item => `
          <div class="frete-item">
            <div>
              <strong style="color: var(--gold);">${item.name}</strong><br>
              <small>Entrega em até ${item.delivery_time} dias úteis</small>
            </div>
            <span style="font-weight: bold; color: #4caf50;">R$ ${parseFloat(item.price).toFixed(2).replace('.', ',')}</span>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = '<p style="color: #ff6b6b; text-align: center;">Erro ao consultar frete.</p>';
      }
    }

    carregarProdutos();
  </script>
</body>
</html>
